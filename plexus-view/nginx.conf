server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: /why/latest, /time, /results ... are client-side routes.
  location / {
    try_files $uri /index.html;
  }
  # Hashed build assets can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
