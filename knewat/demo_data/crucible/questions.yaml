schema: crucible-l2-questions/1
generated_from: plexus.crucible.l2.scenario.play (the Acme Notes script); answers are derived, never typed
scenario:
  subject: Acme Notes API
  agents:
  - planner
  - researcher
  - builder
  tasks: 12
  decisions: 6
  handoffs: 4
  facts: 9
  episodes: 4
  sources: 8
  supersedes: 1
  conflicting_pairs: 2
  reclaims: 1
  forgotten_facts: 1
  marks:
    after_v1: 1760000003500
    before_v2: 1760000017000
    after_v2: 1760000018000
    after_jwt: 1760000029000
    after_apikey: 1760000033000
    end: 1760000064500
conventions: "Conventions for every question:\n- Time is epoch milliseconds. A fact is valid at time t when valid_from <=\
  \ t < valid_to.\n- A fact is named `predicate=value` (for example `api_version=v1`). A fact is \"current\" when its status\
  \ is active\n  (not superseded and not forgotten).\n- A decision is named by the first four words of its text, lower case,\
  \ without punctuation.\n- Tasks are named by their task id (for example `t03-design-endpoints`), agents by their id (planner,\
  \ researcher,\n  builder), artifacts by their uri, sources by their uri.\n- Answer with ONE JSON object and nothing else:\
  \ {\"answer\": <value>}, in the format the question asks for."
questions:
- id: Q01
  family: decision_provenance
  text: Which facts was the decision "Use JWT bearer tokens for user traffic (security requirement); offer API keys only later
    for service accounts." based on?
  format: a JSON list of fact names, e.g. ["predicate=value"]
  kind: set
  item: fact
  answer:
  - auth_method=JWT bearer tokens (RS256)
  - auth_method=API key in X-Api-Key header
  op: decision_facts
  args:
    decision: use jwt bearer tokens
- id: Q02
  family: decision_provenance
  text: Which facts was the decision "Build the Acme Notes API against v1 of the style guide (routes under /v1/)." based on?
  format: a JSON list of fact names, e.g. ["predicate=value"]
  kind: set
  item: fact
  answer:
  - api_version=v1
  op: decision_facts
  args:
    decision: build the acme notes
- id: Q03
  family: decision_provenance
  text: 'Which facts was the decision "Spec approved: endpoints, schema and JWT auth are consistent." based on?'
  format: a JSON list of fact names, e.g. ["predicate=value"]
  kind: set
  item: fact
  answer:
  - api_version=v2
  - auth_method=JWT bearer tokens (RS256)
  op: decision_facts
  args:
    decision: spec approved endpoints schema
- id: Q04
  family: decision_provenance
  text: Which facts was the decision "Evaluate MongoDB 4 as the database (forum post)." based on?
  format: a JSON list of fact names, e.g. ["predicate=value"]
  kind: set
  item: fact
  answer:
  - database=MongoDB 4
  op: decision_facts
  args:
    decision: evaluate mongodb 4 as
- id: Q05
  family: decision_provenance
  text: For each fact that the decision "Use JWT bearer tokens for user traffic (security requirement); offer API keys only
    later for service accounts." was based on, which agent asserted it?
  format: a JSON list of "fact name @ agent" strings, e.g. ["predicate=value@planner"]
  kind: set
  item: fact_by
  answer:
  - auth_method=JWT bearer tokens (RS256)@researcher
  - auth_method=API key in X-Api-Key header@planner
  op: decision_fact_agents
  args:
    decision: use jwt bearer tokens
- id: Q06
  family: decision_provenance
  text: Which source documents (uris) back the facts that the decision "Use JWT bearer tokens for user traffic (security requirement);
    offer API keys only later for service accounts." relied on?
  format: a JSON list of source uris
  kind: set
  item: source
  answer:
  - acme-docs/04_security_note.md
  - acme-docs/05_customer_request.md
  op: decision_sources
  args:
    decision: use jwt bearer tokens
- id: Q07
